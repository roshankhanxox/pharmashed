services:
  - type: web
    name: pharmashed-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn pharmashed_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: DATABASE_URL
        sync: false          # Neon pooled connection string (citizen reports); optional
      - key: NEON_AUTH_BASE_URL
        sync: false          # Neon Auth URL (sign-in); optional
      - key: PHARMASHED_DATA
        value: data/release   # committed snapshot made by scripts/make_release.py
      - key: ASSISTANT_MODEL
        value: gpt-5-mini
      - key: GROQ_API_KEY    # optional fallback provider, used only if OPENAI_API_KEY is unset
        sync: false
      - key: CORS_ORIGINS
        value: https://pharmashed.roshankhan.me
      - key: PYTHON_VERSION
        value: "3.12"
