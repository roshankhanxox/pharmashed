services:
  - type: web
    name: pharmashed-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: .
    healthCheckPath: /api/ping   # Render's own check; also the URL to give an uptime monitor
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn pharmashed_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: DATABASE_URL
        sync: false          # Neon pooled connection string (citizen reports); optional
      - key: NEON_AUTH_BASE_URL
        sync: false          # Neon Auth URL (sign-in); optional
      - key: ADMIN_EMAILS
        sync: false          # optional: comma-separated moderator emails (must be verified). Prefer the moderators table
      - key: AWS_ENDPOINT_URL_S3
        sync: false          # Neon storage bucket (report photos); optional
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false          # the bucket name, "uploads"
      - key: AWS_REGION
        value: us-east-2
      - key: PHARMASHED_DATA
        value: data/release   # committed snapshot made by scripts/make_release.py
      - key: ASSISTANT_MODEL
        value: gpt-5-mini
      - key: GROQ_API_KEY    # optional fallback provider, used only if OPENAI_API_KEY is unset
        sync: false
      - key: CORS_ORIGINS
        value: https://pharmashed.roshankhan.me
      - key: PYTHON_VERSION
        value: "3.12"
