services:
  - type: web
    name: pharmashed-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn pharmashed_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: ASSISTANT_MODEL
        value: gpt-5-mini
      - key: GROQ_API_KEY    # optional fallback provider, used only if OPENAI_API_KEY is unset
        sync: false
      - key: CORS_ORIGINS
        value: https://pharmashed.roshankhan.me
      - key: PYTHON_VERSION
        value: "3.12"
