[project]
name = "pharmashed"
version = "0.0.0"
description = "PharmaShed engine: sampling-priority screening model"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "pydantic>=2.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
fhir = ["fhir.resources>=7.1"]

[project.scripts]
pharmashed = "pharmashed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmashed"]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]
