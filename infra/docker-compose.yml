services:
  hapi:
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_multiple_delete: "true"
      hapi.fhir.reuse_cached_search_results_millis: "0"
    volumes:
      - hapi-data:/data/hapi

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PHARMASHED_DATA: /data/build
    volumes:
      - ../data/build:/data/build:ro
    depends_on:
      - hapi
    profiles:
      - full

volumes:
  hapi-data:
