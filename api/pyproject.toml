[project]
name = "pharmashed-api"
version = "0.0.0"
description = "PharmaShed FastAPI app + assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pharmashed",
    "openai>=1.0",
    "python-dotenv>=1.2.3",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "boto3>=1.43.107",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmashed_api"]

[tool.uv.sources]
pharmashed = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "httpx>=0.27"]
